<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Subhadip Misra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-header">
    <nav class="top-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Projects</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="index.html#skills">Skills</a>
    </nav>
  </header>

  <main class="page-wrap contact-wrap">
    <section class="contact-card">
      <p class="eyebrow">Get in touch</p>
      <h1>Let’s talk</h1>
      <p class="contact-intro">Have a question or want to discuss a project? Send me a message and I’ll get back to you soon.</p>

      <form id="contactForm">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>
        <button class="submit-button" type="submit">Send message</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>Designed by Subhadip Misra</p>
    <p>Email: subhadipmisra2005@gmail.com</p>
  </footer>

  <script>
    const form = document.querySelector("#contactForm");
    const status = document.querySelector("#formStatus");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const name = document.querySelector("#name").value.trim();
      status.textContent = "Thanks, " + name + "! I will reply soon.";
      form.reset();
    });
  </script>
</body>
</html>
